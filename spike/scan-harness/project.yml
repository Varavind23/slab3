name: ScanHarness
options:
  bundleIdPrefix: com.slab3
  deploymentTarget:
    iOS: "17.0"
targets:
  ScanHarness:
    type: application
    platform: iOS
    sources:
      - ScanHarness
      # The app's scanner, built from source — never copied. A previous harness
      # kept its own fork of CertParser, which drifted, so its on-device verdicts
      # were about the harness rather than the app. See HarnessShims.swift.
      - path: ../../ios/Slab3/Scanning/CertParser.swift
      - path: ../../ios/Slab3/Scanning/ScanController.swift
      - path: ../../ios/Slab3/Scanning/CameraSession.swift
      - path: ../../ios/Slab3/Scanning/CameraPreview.swift
      - path: ../../ios/Slab3/Scanning/BarcodeDetector.swift
      - path: ../../ios/Slab3/Scanning/SlabFrameCapture.swift
      - path: ../../ios/Slab3/Scanning/RecentCertWindow.swift
      - path: ../../ios/Slab3/Scanning/ScanGeometry.swift
      - path: ../../ios/Slab3/Models/Grader.swift
    settings:
      base:
        DEVELOPMENT_TEAM: 7BMY83MWA8
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.slab3.ScanHarness
        INFOPLIST_KEY_NSCameraUsageDescription: "Scans PSA/CGC cert barcodes on graded card slabs."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
